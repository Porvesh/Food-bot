<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lunch Bot logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#F0463A"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F4F7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- rounded-square background tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- crossed fork + knife behind the plate -->
  <g stroke="#FFD9CE" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <!-- knife -->
    <line x1="150" y1="118" x2="362" y2="394"/>
    <!-- fork stem -->
    <line x1="362" y1="118" x2="150" y2="394"/>
  </g>

  <!-- plate = robot face -->
  <g filter="url(#soft)">
    <circle cx="256" cy="262" r="150" fill="url(#plate)"/>
    <circle cx="256" cy="262" r="118" fill="none" stroke="#E3E7EE" stroke-width="8"/>
  </g>

  <!-- antenna -->
  <line x1="256" y1="112" x2="256" y2="150" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="104" r="14" fill="#FFFFFF"/>

  <!-- eyes -->
  <circle cx="212" cy="244" r="20" fill="#2B2F36"/>
  <circle cx="300" cy="244" r="20" fill="#2B2F36"/>
  <circle cx="219" cy="237" r="6" fill="#FFFFFF"/>
  <circle cx="307" cy="237" r="6" fill="#FFFFFF"/>

  <!-- happy mouth -->
  <path d="M210 300 Q256 340 302 300" fill="none" stroke="#2B2F36" stroke-width="13" stroke-linecap="round"/>
</svg>
