[project]
name = "lunchbot"
version = "0.1.0"
description = "A self-learning Slack bot that suggests where the team eats."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "slack-bolt>=1.18,<2",
    "apscheduler>=3.10,<4",
    "anthropic>=0.39",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.5",
]

[project.scripts]
lunchbot = "lunchbot.main:main"

[tool.setuptools.packages.find]
include = ["lunchbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
